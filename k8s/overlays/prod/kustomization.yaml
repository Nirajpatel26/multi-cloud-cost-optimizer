apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include base resources + the new AWS credentials secret
resources:
  - ../../
  - aws-credentials-secret.yaml

# Patches applied on top of the base
patches:
  - path: backend-configmap-patch.yaml   # flips USE_REAL_AWS=true, SERVICE_MODE=aws
  - path: backend-deployment-patch.yaml  # adds AWS secret to envFrom, imagePullPolicy=Always
