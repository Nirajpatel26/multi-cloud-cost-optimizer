apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mcco
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mcco-frontend:latest
          imagePullPolicy: Never   # use locally built image, don't pull from registry
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontend-config
